<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NORTH4 — Concept C · The Modern Family Kitchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./_palette.css">
<style>
/* =========================================================================
   CONCEPT C — THE MODERN FAMILY KITCHEN LOOKING INTO THE ORCHARD
   Three seconds: "Someone's already up. Dinner's handled. Come in."

   Composition : DEPTH PLANES, asymmetric. Far → mid → near.
                 FAR  the orchard, through a window, upper right
                 MID  the wall, the steel window frame
                 NEAR the island counter — oak, bottom 45%, running off-screen
                      at your waist. You are STANDING AT IT.
   The orchard  : A GLIMPSE while you're busy. Never the subject.
   Materials    : natural oak + blossom lead. The counter is the ground plane.
   Light        : through the window (upper right), falling down-left across
                  the oak. The light is the reason the counter is warm.
   ========================================================================= */

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: "Inter", "DejaVu Sans", system-ui, sans-serif;
  color: var(--ink-body);
  background: var(--plaster);
  -webkit-font-smoothing: antialiased;
}

.kitchen {
  position: relative; min-height: 100vh; overflow: hidden;
  --counter-y: 522px;
  /* the wall: lit from the window on the right, falling into shade at the left */
  background: linear-gradient(100deg,
    hsl(34 24% 84%) 0%, hsl(36 34% 89%) 26%, hsl(38 46% 94%) 62%, hsl(40 58% 96%) 100%);
}

/* ---- the constant shell ---- */
.shell {
  position: absolute; z-index: 8; top: 0; left: 0; right: 0;
  height: 64px; padding: 0 34px;
  display: flex; align-items: center; justify-content: space-between;
}
.mark { display: flex; align-items: center; gap: 10px; }
.mark-apple {
  width: 22px; height: 22px; border-radius: 50% 50% 48% 48%;
  background: linear-gradient(150deg, var(--leaf-lift), var(--leaf)); position: relative;
}
.mark-apple::after {
  content: ""; position: absolute; top: -3px; left: 11px;
  width: 9px; height: 6px; border-radius: 0 70% 0 70%;
  background: var(--gold); transform: rotate(-18deg);
}
.mark-name { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-quiet); font-weight: 500; }
.bell { width: 18px; height: 18px; opacity: .34; }

/* ---- FAR + MID: THE WINDOW over the worktop, upper right ----
   A modern steel grid, six panes. It runs off the right edge of the screen,
   which is what stops it being a picture hanging on a wall. */
.window {
  position: absolute; z-index: 2;
  top: 104px; left: 700px; right: -2px; height: 402px;
  overflow: hidden;
  background: hsl(45 40% 26%);
  box-shadow:
    0 0 0 5px hsl(41 44% 93%),                 /* the reveal: the wall has thickness */
    0 0 0 6px hsl(38 22% 78%),                 /* its far arris */
    /* the wall casts INTO the opening — this is what makes it a hole, not a frame */
    inset 0 14px 22px -8px hsl(45 50% 14% / .5),
    inset 14px 0 24px -10px hsl(45 50% 14% / .34),
    inset 0 0 0 1px hsl(45 40% 20% / .6);
}
.window img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; object-position: 52% 46%;
}
/* the glazing bars — thin, dark, structural. Three bays, two rows. */
.bar { position: absolute; z-index: 3; background: hsl(48 12% 22%); box-shadow: 0 0 6px hsl(56 40% 9% / .3); }
.bar.v { top: 0; bottom: 0; width: 6px; }
.bar.v1 { left: 33.33%; }
.bar.v2 { left: 66.66%; }
.bar.h { left: 0; right: 0; height: 6px; top: 50%; }

/* ---- THE LIGHTFALL — morning through the window, onto the counter ----
   A parallelogram leaning down-LEFT, because the window is on the RIGHT.
   This single shape is what makes the counter feel lit rather than coloured. */
.lightfall {
  position: absolute; z-index: 5;
  top: var(--counter-y); left: 0; right: 0; bottom: 0;
  background:
    radial-gradient(74% 120% at 78% 4%,
      hsl(43 94% 90% / .82) 0%,
      hsl(43 90% 89% / .46) 38%,
      hsl(42 84% 88% / .16) 66%,
      hsl(42 80% 88% / 0) 88%);
  pointer-events: none;
}

/* ---- NEAR: THE ISLAND COUNTER — oak, at your waist, running off the bottom ----
   This is the ground plane (Experience Blueprint § 8). It is the only layer
   that varies by domain, and in Home it is the counter you stand at. */
.counter {
  position: absolute; z-index: 4; left: 0; right: 0;
  top: var(--counter-y); bottom: 0;
  background:
    /* the grain: a few soft lines, never a texture pattern */
    repeating-linear-gradient(91deg,
      hsl(38 30% 66% / 0) 0px, hsl(38 30% 66% / 0) 38px,
      hsl(36 26% 60% / .16) 39px, hsl(38 30% 66% / 0) 41px),
    linear-gradient(196deg,
      hsl(41 38% 74%) 0%, hsl(40 34% 70%) 30%, hsl(38 29% 63%) 68%, hsl(37 25% 57%) 100%);
}
/* the back edge, where the counter meets the wall: one shadow does the depth */
.counter::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 22px;
  background: linear-gradient(to bottom, hsl(45 44% 22% / .40), hsl(45 40% 26% / 0));
}
/* the front lip: the counter has thickness, and you are standing at it */
.counter::after {
  content: ""; position: absolute; top: -3px; left: 0; right: 0; height: 3px;
  background: hsl(42 44% 78%);   /* the lit top arris */
}

/* ---- THE GREETING — on the wall, ranged left, at eye height ---- */
.greeting { position: absolute; z-index: 6; left: 34px; top: 168px; }
.welcome {
  font-family: "Fraunces", "DejaVu Serif", Georgia, serif;
  font-weight: 300; font-size: 25px; color: var(--ink-body); opacity: .78;
}
.name {
  font-family: "Fraunces", "DejaVu Serif", Georgia, serif;
  font-weight: 300; font-size: 68px; line-height: 1.04; letter-spacing: -.022em;
  color: var(--ink); margin-top: 1px;
}
.date { margin-top: 13px; font-size: 12.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-quiet); }

/* ---- THE COMPANION — a note on the wall, under the greeting ---- */
.note {
  position: absolute; z-index: 6; left: 34px; top: 336px; width: 300px;
  background: var(--surface); border-radius: 2px; padding: 15px 17px 14px;
  box-shadow: var(--shade-3);
  border-top: 2px solid hsl(43 46% 72% / .55);
}
.note-from {
  display: flex; align-items: center; gap: 6px;
  font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-quiet); margin-bottom: 8px;
}
.note-leaf { width: 11px; height: 11px; }
.note-body { font-size: 13.5px; line-height: 1.5; color: var(--ink-body); }
.note-link { display: inline-block; margin-top: 9px; font-size: 12.5px; color: var(--leaf-lift); font-weight: 500; }

/* ---- ON THE COUNTER — the three facts, as THINGS LEFT OUT ----
   C is the concept where content is OBJECTS. They are ivory on oak, they sit
   in the light, and each one casts a real contact shadow. That contact shadow
   is the whole difference between a thing on a counter and a card on a page. */
.onCounter {
  position: absolute; z-index: 6;
  top: calc(var(--counter-y) + 74px); left: 34px; right: 34px;
}
.things { display: flex; gap: 18px; align-items: flex-start; }
.thing {
  flex: 1 1 0; max-width: 322px;
  background: linear-gradient(180deg, var(--raw-blossom), hsl(38 52% 94%));
  border-radius: 3px; padding: 15px 17px 16px;
  box-shadow:
    0 1px 0 hsl(40 60% 98% / .9) inset,
    0 18px 24px -14px hsl(45 50% 16% / .46),   /* the contact shadow on the oak */
    0 3px 6px -2px hsl(45 50% 16% / .28);
}
.thing-label {
  font-size: 10px; letter-spacing: .15em; text-transform: uppercase;
  color: var(--ink-quiet); margin-bottom: 9px;
}
.thing-value { font-family: "Fraunces", "DejaVu Serif", Georgia, serif; font-size: 23px; font-weight: 400; color: var(--ink); }
.thing-value .unit { font-size: 13px; color: var(--ink-quiet); }
.thing-value.quiet { font-size: 15.5px; color: var(--ink-quiet); font-style: italic; }

.action {
  margin-top: 26px; padding: 13px 32px; border: 0; border-radius: 999px;
  background: var(--leaf); color: var(--raw-blossom);
  font-family: inherit; font-size: 14.5px; font-weight: 500; letter-spacing: .015em;
  box-shadow: 0 12px 20px -10px hsl(45 50% 16% / .5), 0 2px 4px hsl(45 50% 16% / .25);
  cursor: pointer;
}

/* ---- THE DOORS — drawer fronts along the front of the island ---- */
.doors {
  position: absolute; z-index: 7; left: 0; right: 0; bottom: 0;
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: linear-gradient(to bottom, hsl(38 28% 58%), hsl(40 26% 52%));
  box-shadow: 0 -14px 24px -14px hsl(45 50% 16% / .45);
}
.door {
  height: 64px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 26px; position: relative;
  border-top: 1px solid hsl(42 40% 74% / .5);
}
.door + .door { border-left: 1px solid hsl(45 40% 30% / .3); }
.door-name { font-size: 14px; font-weight: 500; color: hsl(42 46% 96%); }
.door-handle {
  width: 26px; height: 4px; border-radius: 2px;
  background: linear-gradient(to bottom, hsl(42 40% 82%), hsl(43 34% 62%));
  box-shadow: 0 1px 2px hsl(45 50% 16% / .5);
}

/* =======================  TABLET  =======================
   The window can no longer run off the right AND leave wall for the greeting.
   The greeting moves above it; the room keeps its three planes. */
@media (max-width: 900px) {
  .kitchen { --counter-y: 680px; }
  .window { top: 300px; left: 300px; height: 372px; }
  .greeting { top: 108px; }
  .name { font-size: 62px; }
  .note { top: 300px; left: 34px; width: 246px; }
  .thing { flex: 1 1 0; max-width: none; }
  .onCounter { top: calc(var(--counter-y) + 74px); }
}

/* =======================  MOBILE  =======================
   THE HONEST COST OF C. There is no room for a window AND a counter AND a
   wall on a 390px screen. The window becomes a high band; the counter keeps
   the bottom. The three planes survive; the glimpse-while-busy does not —
   at this width the orchard is simply above you, which is B's idea, not C's. */
@media (max-width: 520px) {
  .kitchen { --counter-y: 354px; }
  .window {
    top: 200px; left: 18px; right: 18px; height: 138px;
    box-shadow: 0 0 0 4px hsl(41 44% 93%), 0 0 0 5px hsl(38 22% 78%),
                inset 0 10px 16px -6px hsl(45 50% 14% / .5), inset 0 0 0 1px hsl(45 40% 20% / .6);
  }
  .bar.v2 { display: none; }
  .bar.v1 { left: 50%; }
  .greeting { left: 18px; top: 78px; }
  .welcome { font-size: 18px; }
  .name { font-size: 46px; }
  .date { margin-top: 10px; font-size: 11px; }
  .note { position: static; margin: 0; width: auto; }
  .noteWrap { position: absolute; z-index: 6; left: 18px; right: 18px; top: calc(var(--counter-y) + 16px); }
  .onCounter { top: calc(var(--counter-y) + 148px); left: 18px; right: 18px; }
  .things { flex-direction: column; gap: 10px; }
  .thing { width: 100%; max-width: none; display: flex; align-items: baseline; justify-content: space-between; padding: 13px 15px; }
  .thing-label { margin-bottom: 0; }
  .thing-value { font-size: 19px; }
  .thing-value.quiet { font-size: 14px; }
  .action { width: 100%; margin-top: 14px; }
  .doors { grid-template-columns: 1fr 1fr; }
  .door { height: 56px; padding: 0 18px; }
  .door:nth-child(3), .door:nth-child(4) { border-top: 1px solid hsl(45 40% 30% / .3); }
  .door:nth-child(3) { border-left: 0; }
}
</style>
</head>
<body>
<div class="kitchen">

  <header class="shell">
    <div class="mark">
      <div class="mark-apple"></div>
      <div class="mark-name">The Healthy Apples</div>
    </div>
    <svg class="bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/>
    </svg>
  </header>

  <!-- FAR: the orchard, glimpsed over the worktop -->
  <div class="window">
    <img src="../../attached_assets/design/north_star/v2/ORCHARD.png" alt="">
    <div class="bar v v1"></div>
    <div class="bar v v2"></div>
    <div class="bar h"></div>
  </div>

  <!-- NEAR: the island you are standing at -->
  <div class="counter"></div>
  <div class="lightfall"></div>

  <div class="greeting">
    <div class="welcome">Welcome home,</div>
    <h1 class="name">Chloe</h1>
    <div class="date">Friday, 17 July</div>
  </div>

  <div class="noteWrap">
    <aside class="note">
      <div class="note-from">
        <svg class="note-leaf" viewBox="0 0 24 24" fill="none" stroke="var(--leaf-lift)" stroke-width="1.8">
          <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
        </svg>
        Companion
      </div>
      <div class="note-body">The orchard is in blossom. A good week for something green and simple.</div>
      <a class="note-link" href="#">View suggestion &rsaquo;</a>
    </aside>
  </div>

  <!-- things left out on the counter -->
  <div class="onCounter">
    <div class="things">
      <div class="thing">
        <div class="thing-label">Meals</div>
        <div class="thing-value quiet">Nothing planned</div>
      </div>
      <div class="thing">
        <div class="thing-label">Shopping</div>
        <div class="thing-value quiet">List is clear</div>
      </div>
      <div class="thing">
        <div class="thing-label">From the orchard</div>
        <div class="thing-value">0<span class="unit"> / 30 plants</span></div>
      </div>
    </div>
    <button class="action">Plan today</button>
  </div>

  <nav class="doors">
    <div class="door"><span class="door-name">Planner</span><span class="door-handle"></span></div>
    <div class="door"><span class="door-name">Cookbook</span><span class="door-handle"></span></div>
    <div class="door"><span class="door-name">Pantry</span><span class="door-handle"></span></div>
    <div class="door"><span class="door-name">Shopping</span><span class="door-handle"></span></div>
  </nav>

</div>
</body>
</html>
