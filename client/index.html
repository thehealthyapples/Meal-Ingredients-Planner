<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- PX1-W1 (fnd-px-no-viewport-fit): viewport-fit=cover activates the 12
         env(safe-area-inset-*) call sites (nav-bar, .main-safe, …), which
         otherwise resolve to their 0px fallback on iOS. maximum-scale=1 blocked
         pinch-zoom (WCAG 1.4.4) and is dropped. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- PX1-W3 (fnd-px-oversized-assets): this render-blocking request used to
         name ~25 font families from the original scaffold. THA's type system
         defines exactly two (index.css --font-sans: Inter, --font-display:
         DM Sans); nothing else ever rendered, so nothing changes visually. -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
