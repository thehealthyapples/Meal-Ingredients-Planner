<svg width="220" height="176" viewBox="0 0 220 176" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <!--
    Environmental Dressing · LH2 (Winter) — winter evergreens.
    Claim-free SEASONAL object (LIVINGHOME2 § 5 "deep-winter comfort"; ED1–ED12); admitted
    against LHDC1. A few evergreen sprigs (fir/pine) gathered in a ceramic jug — the green
    that endures midwinter, brought in. It is DELIBERATELY NOT A WREATH: a wreath is
    celebration dressing (ED9 / § 7.2, Phase 5, gated behind declared traditions + the
    dressing-permission mechanism, neither built), and § 6 refuses any occasion marker
    shown without the household's declaration. This is seasonal foliage, carrying no
    occasion. Calm Orchard palette (muted deep greens), matte, still, wordless, one-morning
    light upper-left. Same hand as the bowl of apples.
  -->
  <ellipse cx="112" cy="150" rx="56" ry="10" fill="hsl(38 18% 42%)" opacity="0.12"/>
  <!-- evergreen sprigs — needled boughs, muted deep green -->
  <g stroke="hsl(122 20% 34%)" stroke-linecap="round" fill="none">
    <path d="M112 100c-1 -22 -1 -40 -2 -58" stroke-width="3.5"/>
    <path d="M96 98c-8 -16 -16 -28 -28 -38" stroke-width="3"/>
    <path d="M128 98c8 -16 16 -28 28 -36" stroke-width="3"/>
  </g>
  <!-- needles along each bough (short strokes), the near ones a touch lighter in the morning -->
  <g stroke-linecap="round" stroke-width="2.4">
    <g stroke="hsl(126 18% 38%)">
      <path d="M110 82l-9 -6M110 82l9 -6M108 68l-9 -5M108 68l9 -5M107 54l-8 -5M107 54l8 -5M110 96l-9 -5M110 96l9 -5"/>
    </g>
    <g stroke="hsl(122 20% 32%)">
      <path d="M88 84l-11 -1M88 84l-6 -10M80 74l-11 -2M80 74l-5 -10M72 64l-11 -2M72 64l-4 -9"/>
      <path d="M136 84l11 -1M136 84l6 -10M144 74l11 -2M144 74l5 -10M152 64l11 -2M152 64l4 -9"/>
    </g>
    <!-- upper-left morning on the top needles -->
    <g stroke="hsl(120 22% 48%)" opacity="0.7">
      <path d="M108 52l-8 -5M110 82l-9 -6M88 84l-6 -10"/>
    </g>
  </g>
  <!-- the ceramic jug, matte oatmeal -->
  <path d="M86 98c-2 6 -2 30 4 40 4 6 12 10 22 10s18 -4 22 -10c6 -10 6 -34 4 -40 -7 4 -16 6 -26 6s-19 -2 -26 -6z" fill="hsl(35 22% 74%)"/>
  <path d="M86 98c7 5 17 7 26 7s19 -2 26 -7" stroke="hsl(38 26% 84%)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M94 128c11 4 30 4 40 0" stroke="hsl(32 16% 55%)" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.3"/>
</svg>
