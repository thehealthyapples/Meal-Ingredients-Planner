<svg width="220" height="176" viewBox="0 0 220 176" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <!--
    Environmental Dressing · LH2 (Summer) — subtle seasonal fruit.
    Claim-free seasonal object (LIVINGHOME2 § 5 "the year's turns"; ED1–ED12); admitted
    against LHDC1. A shallow hand-thrown dish of a few small summer stone-fruits (plums),
    the house's own fruit in its summer turn — claiming nothing about any household (ED3).
    Calm Orchard palette, matte, still, wordless, one-morning light upper-left. Same hand
    as the bowl of apples; refused in the Larder/Pantry and Nutrition, as all produce is.
  -->
  <ellipse cx="112" cy="146" rx="76" ry="11" fill="hsl(38 18% 42%)" opacity="0.13"/>
  <!-- the small fruits, gathered low in a shallow dish -->
  <g>
    <!-- back plum (muted deep) -->
    <ellipse cx="86" cy="104" rx="20" ry="21" fill="hsl(338 20% 46%)"/>
    <path d="M86 84c-1 4 -1 8 0 12" stroke="hsl(338 16% 34%)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="80" cy="97" rx="7" ry="6" fill="hsl(340 24% 66%)" opacity="0.35"/>
    <!-- right plum (muted red-plum) -->
    <ellipse cx="138" cy="106" rx="21" ry="22" fill="hsl(348 26% 52%)"/>
    <path d="M138 85c-1 4 -1 8 0 12" stroke="hsl(346 18% 36%)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="131" cy="99" rx="8" ry="6" fill="hsl(350 30% 72%)" opacity="0.34"/>
    <!-- front plum (blush, nearest and lowest) -->
    <ellipse cx="112" cy="116" rx="23" ry="23" fill="hsl(342 26% 56%)"/>
    <path d="M112 94c-1 4 -1 8 0 12" stroke="hsl(342 18% 38%)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="104" cy="109" rx="9" ry="7" fill="hsl(346 32% 76%)" opacity="0.34"/>
  </g>
  <!-- the shallow ceramic dish, matte oatmeal; its near wall crosses the fruit's base -->
  <path d="M52 118c0 14 27 24 60 24s60 -10 60 -24c0 -3 -3 -5 -6 -4 -11 4 -32 8 -54 8s-43 -4 -54 -8c-3 -1 -6 1 -6 4z" fill="hsl(35 22% 73%)"/>
  <path d="M52 118c8 6 31 12 60 12s52 -6 60 -12" stroke="hsl(38 26% 84%)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M74 132c13 3 46 3 72 -1" stroke="hsl(32 16% 55%)" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.3"/>
</svg>
