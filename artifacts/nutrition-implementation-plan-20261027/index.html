<h1>Nutrition page — five implementation concepts</h1>
<p>Concepts only. Numbers and household examples are illustrative, not live data or an approved final design. The garden image is an existing repository asset; all text and data remain on solid surfaces.</p>
<div class="grid">
<figure><a href="01-foods-overview-desktop.svg"><img src="01-foods-overview-desktop.svg" alt="Foods overview desktop concept"></a><figcaption>1. Foods overview — desktop<small>Weekly facts and clear source/time scope.</small></figcaption></figure>
<figure><a href="02-nutrients-knowledge-desktop.svg"><img src="02-nutrients-knowledge-desktop.svg" alt="Nutrient knowledge desktop concept"></a><figcaption>2. Nutrient knowledge — desktop<small>Knowledge coverage is distinguished from nutrient intake.</small></figcaption></figure>
<figure><a href="03-source-detail-desktop.svg"><img src="03-source-detail-desktop.svg" alt="Evidence detail desktop concept"></a><figcaption>3. Evidence detail — desktop<small>Source trail, contingent on owner-backed links.</small></figcaption></figure>
<figure><a href="04-incomplete-data-desktop.svg"><img src="04-incomplete-data-desktop.svg" alt="Incomplete data desktop concept"></a><figcaption>4. No history yet — desktop<small>Missing data stays unknown; it is not represented as zero.</small></figcaption></figure>
<figure><a href="05-nutrition-phone.svg"><img src="05-nutrition-phone.svg" alt="Nutrition phone concept"></a><figcaption>5. Nutrition — phone<small>Same hierarchy, adapted to a narrow screen.</small></figcaption></figure>
