  - pumpkin
  - courgette
  - sweet-potato
  - butternut squash soup ready-made
  canonical_identity_rule: Butternut Squash is the canonical identity. Plain fresh, frozen or single-ingredient forms remain
    variants; ready meals, sauces, snacks and branded prepared products are excluded.
  plant_count_policy:
    counts_towards_plant_diversity: true
    plant_family: Cucurbitaceae
    plant_part: fruit
    plant_diversity_note: Count as one plant identity for THA weekly diversity unless a future governed variety rule states
      otherwise.
