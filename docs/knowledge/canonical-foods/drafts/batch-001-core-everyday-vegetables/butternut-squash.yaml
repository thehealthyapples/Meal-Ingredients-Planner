cooking_and_storage:
  storage: Store according to supermarket pack guidance; keep fresh produce cool and dry or refrigerated where appropriate.
  prep_tips: Wash and prepare butternut squash before use. Use plain cooking methods before adding sauces or seasonings.
  texture_notes: Use cooking time to control whether butternut squash stays crisp, soft or mashable.
  leftover_notes: Cool cooked leftovers promptly and follow normal food-safety guidance before reusing.
