- area: gut-health
  approved_wording: Butternut Squash can help add plant variety and fibre context to everyday meals.
  evidence_tone: high_level_consensus
  governance_note: Food-first wording only; no gut-disease or microbiome-treatment claim.
- area: heart-health
  approved_wording: Butternut Squash can sit comfortably in heart-health meal patterns when used as part of vegetable-rich
    cooking.
  evidence_tone: high_level_consensus
  governance_note: Pattern-level wording only; no disease prevention claim.
