batch_id: batch-001-core-everyday-vegetables
created: '2026-07-07'
format: zip_of_individual_v2_0_draft_yaml_files
target_path: docs/knowledge/canonical-foods/drafts/batch-001-core-everyday-vegetables/
approved_scope: Option A — comprehensive UK supermarket canonical library, starting with Batch 1 core everyday vegetables
food_count: 30
smoke_test_files:
- carrot.yaml
- onion.yaml
- tomato.yaml
full_batch_files:
- carrot.yaml
- onion.yaml
- garlic.yaml
- shallot.yaml
- spring-onion.yaml
- leek.yaml
- celery.yaml
- cucumber.yaml
- tomato.yaml
- sweet-pepper.yaml
- aubergine.yaml
