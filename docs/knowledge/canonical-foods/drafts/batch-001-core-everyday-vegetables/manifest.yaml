import_commands:
  smoke_test_one: npm run import:canonical-foods docs/knowledge/canonical-foods/drafts/batch-001-core-everyday-vegetables/carrot.yaml
  smoke_test_three: npm run import:canonical-foods docs/knowledge/canonical-foods/drafts/batch-001-core-everyday-vegetables/{carrot,onion,tomato}.yaml
  full_batch: npm run import:canonical-foods docs/knowledge/canonical-foods/drafts/batch-001-core-everyday-vegetables/*.yaml
architecture_controls:
- one canonical identity per food
- aliases do not create duplicate entities
- unresolved nutrient/benefit terms must be rejected and reported
- no numeric nutrition values imported until validated
- no branded or ultra-processed foods
known_limitations:
- Files are editorial drafts and still need Claude/repo schema validation before merge.
- Nutrient and benefit terms are intentionally conservative to avoid creating vocabulary drift.
- No production import should occur before smoke test and review of importer warnings.
