  - salad leaf
  - peppery garnish
  - meal finisher
  good_uses:
  - salads
  - pasta finishes
  - pizza-style toppings after cooking
  - sandwiches
  - grain bowls
  nutrition_boost_tags:
  - plant-diversity
  - whole-food
