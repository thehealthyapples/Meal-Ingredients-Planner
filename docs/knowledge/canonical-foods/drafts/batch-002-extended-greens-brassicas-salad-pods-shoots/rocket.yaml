record:
  schema: tha_canonical_food_draft
  schema_version: 2.0-draft
  batch_id: batch-002-extended-greens-brassicas-salad-pods-shoots
  status: draft
  canonical_slug: rocket
  display_name: Rocket
  duplicate_policy: stop_on_slug_conflict_or_merge_only_with_explicit_approval
  authored_by: ChatGPT for The Healthy Apples
  authored_date: '2026-07-07'
  review_status: requires_claude_import_validation_before_merge
nk_controls:
  governing_patterns:
  - one_canonical_identity
  - one_owner_per_fact
  - no_duplicate_entities
  - progressive_enrichment
  - honest_gaps_over_fabricated_information
  ai_usage_rules:
  - AI may draft editorial wording but must not create new canonical nutrient or benefit vocabulary.
  - Unresolved nutrients, benefits, aliases or identity conflicts must be rejected for review, not silently minted.
  numeric_nutrition_policy: do_not_import_numeric_values_until_validated
  fact_owner_boundary: Food identity belongs to the Knowledge Platform. Nutrient and benefit vocabularies remain TypeScript-owned
    canonical vocabularies.
identity:
  food_category: salad_leaf
  aliases:
  - rocket leaves
  - arugula
  - wild rocket
  - baby rocket
  not_same_as:
  - lettuce
  - watercress
  - spinach
  - dressed rocket salad
  canonical_identity_rule: Rocket is the canonical identity for the plain whole-food ingredient. Plain fresh, frozen, tinned-in-water
    or single-ingredient forms remain variants where appropriate; ready meals, sauces, snacks, dressed mixes and branded prepared
    products are excluded.
  plant_count_policy:
    counts_towards_plant_diversity: true
    plant_family: Brassicaceae
    plant_part: leaf
    plant_diversity_note: Count as one plant identity for THA weekly diversity unless a future governed variety rule states
      otherwise.
classification:
  whole_food_status: whole_or_minimally_processed
  upf_default: false
  processing_watchouts:
  - Exclude ready meals, battered products, crisps, sweetened jars, seasoned pouches and sauce-coated prepared products.
  - Plain fresh, frozen or tinned-in-water forms may remain under this canonical identity when single-ingredient.
varieties_and_forms:
  varieties:
  - name: rocket leaves
    relationship: alias_or_market_form
  - name: arugula
    relationship: alias_or_market_form
  - name: wild rocket
    relationship: alias_or_market_form
  - name: baby rocket
    relationship: alias_or_market_form
  forms:
  - name: bagged plain leaves
    relationship: same_canonical_food_when_plain
  - name: loose leaves
    relationship: same_canonical_food_when_plain
  - name: wild rocket
    relationship: same_canonical_food_when_plain
  preparation_states:
  - raw
  - wilted briefly
  - used as garnish
  form_policy: Do not create a new canonical identity for cut size, pack format, frozen state or plain tinned state unless
    THA later approves a separate fact owner.
nutrition_profile:
  quantitative_values_status: do_not_import_numeric_values_until_validated
  notable_nutrients:
  - nutrient: vitamin-k
    role: Contributes vitamin K context within leafy-green and brassica-rich meal patterns.
    confidence: well_established
  - nutrient: vitamin-c
    role: Contributes vitamin C within everyday fruit and vegetable intake.
    confidence: well_established
  - nutrient: polyphenols
    role: Adds plant compounds that support food diversity context.
    confidence: moderate
  editorial_summary: A peppery salad leaf that adds flavour intensity without needing heavy sauces or dressings.
  vocabulary_policy: All nutrient strings intentionally use existing canonical vocabulary where known; unresolved terms should
    go to Knowledge Review.
benefit_language:
- area: heart-health
  approved_wording: Rocket can sit comfortably in heart-health meal patterns when used as part of vegetable-rich cooking.
  evidence_tone: high_level_consensus
  governance_note: Pattern-level wording only; no disease prevention claim.
- area: gut-health
  approved_wording: Rocket can help add plant variety and fibre context to everyday meals.
  evidence_tone: high_level_consensus
  governance_note: Food-first wording only; no gut-disease or microbiome-treatment claim.
planner_metadata:
  meal_slots:
  - lunch
