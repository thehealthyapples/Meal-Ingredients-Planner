  household_notes: A peppery salad leaf that adds flavour intensity without needing heavy sauces or dressings.
  adaptation_notes: Usually compatible as a shared component; adapt cooking fat, sauce, toppings, texture and spice level
    to household needs.
shopping_intelligence:
  supermarket_locations:
  - fresh salad
  - prepared salad leaves when plain
  buying_notes: Look for plain rocket without sauces, coatings, dressings or seasoning mixes.
  quality_signals:
  - fresh appearance where expected
  - no visible mould
  - avoid slimy, sour-smelling or heavily bruised pieces
  budget_notes: Loose, own-brand, frozen plain, tinned-in-water or seasonal packs may be better-value formats when available
    and appropriate.
  search_terms:
  - rocket
  - rocket leaves
  - arugula
  - wild rocket
  - baby rocket
cooking_and_storage:
  storage: Store according to supermarket pack guidance; keep fresh produce cool and dry or refrigerated where appropriate.
  prep_tips: Wash and prepare rocket before use. Use plain cooking methods before adding sauces or seasonings.
  texture_notes: Use cooking time to control whether the ingredient stays crisp, tender, wilted or soft.
  leftover_notes: Cool cooked leftovers promptly and follow normal food-safety guidance before reusing.
relationships:
  pairs_well_with:
  - tomato
  - parmesan-cheese
  - olive-oil
  - lemon
  - lentils
  nutrient_complements:
  - with: extra-virgin-olive-oil
    reason: Helps turn vegetables into satisfying meals while keeping the meal whole-food-led.
  - with: lentils
    reason: Combines vegetable variety with a pulse-based meal component where appropriate.
  category_neighbours:
  - brussels-sprouts
  - spring-greens
  - pak-choi
  - chinese-leaf
  - swiss-chard
  - watercress
  do_not_replace:
