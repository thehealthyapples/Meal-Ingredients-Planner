cooking_and_storage:
  storage: Store according to supermarket pack guidance; keep fresh produce cool and dry or refrigerated where appropriate.
    Store dried goods sealed in a cool dry cupboard.
  prep_tips: Wash, drain, soak, peel, chop or cook bilberry as appropriate for the form. Use plain cooking methods before
    adding sauces or seasonings.
  texture_notes: Use preparation and cooking time to control whether the ingredient stays crisp, juicy, tender, soft, chewy
    or mashable.
  leftover_notes: Cool cooked leftovers promptly and follow normal food-safety guidance before reusing.
