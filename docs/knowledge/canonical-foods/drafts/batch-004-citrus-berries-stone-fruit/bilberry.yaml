safety_and_limitations:
  allergen_profile: Naturally free from common animal allergens unless prepared with other ingredients; always check packaged
    forms.
  diet_compatibility:
  - vegan
  - vegetarian
  - gluten-free
  - dairy-free
  clinical_caveats: Medical diet suitability, allergy risk and therapeutic claims require professional or user-specific review.
  storage_safety: Discard if mouldy, slimy, sour-smelling beyond normal fermented contexts, leaking, or outside safe storage
    guidance.
companion_behaviour:
  plain_answer: Bilberry is a whole-food ingredient that can help add variety and simple nutrition context to meals.
  suggested_user_facing_phrases:
  - Add bilberry to increase whole-food variety.
  - Use plain bilberry rather than sweetened, flavoured or ready-made versions.
  - Bilberry works well in porridge toppings, yoghurt bowls, plain compotes.
  avoid_phrases:
